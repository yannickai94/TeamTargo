  var team=obsTeamAvg(),weak=weakestPhase(team),hasTeam=OBS_PHASES.some(function(p){return team[p.id]});
  var tool='<div class="toolbar rise"><span class="muted small">Rhythmus: alle '+(S.settings.obsDays||120)+' Tage</span><span class="sp"></span><button class="btn primary" data-act="obs-new">'+ic('plus',16)+' Beobachtung erfassen</button></div>';
  var whoCard='<section class="card glass rise s7"><div class="card-h"><h2>Wen als Nächstes?</h2><span class="sub">Hospitation im Kundengespräch</span></div>'+who.map(function(x){return '<div class="row"><div class="click" data-act="person" data-id="'+esc(x.e.id)+'" style="cursor:pointer">'+avatar(x.e.name,'sm')+'</div><div class="grow"><b>'+esc(x.e.name)+'</b>'+chipC(esc(x.s.l),x.s.c)+'</div><button class="btn sm" data-act="obs-new" data-emp="'+esc(x.e.id)+'">'+ic('eye',14)+' Beobachten</button></div>'}).join('')+'</section>';
  var teamCard='<section class="card glass rise s5"><div class="card-h"><h2>Team-Profil</h2><span class="sub">Ø der letzten Beobachtungen</span></div>'+(hasTeam?phaseBars(team)+(weak?'<div class="hint-box"><b>Schwächste Phase: '+esc(weak.p.n)+'</b><span class="muted small">Ø '+dec(weak.v)+' · '+esc(weak.p.h)+'</span><button class="btn sm" data-act="obs-task" data-p="'+esc(weak.p.id)+'">'+ic('tasks',14)+' Teamtraining als Aufgabe</button></div>':''):'<p class="muted">Sobald Beobachtungen erfasst sind, siehst du hier, wo das ganze Team Luft nach oben hat.</p>')+'</section>';
  var list=obsOf().slice(0,12);
  var last='<section class="card glass rise s12"><div class="card-h"><h2>Letzte Beobachtungen</h2></div>'+(list.length?list.map(function(o){return obsRow(o,true)}).join(''):empty('eye','Noch keine Beobachtung','Erfasse nach einem Kundengespräch, was gut lief und worauf die Person achten kann.','<button class="btn primary" data-act="obs-new">'+ic('plus',16)+' Erste Beobachtung</button>'))+
    '<p class="muted small" style="margin-top:12px">Gute Praxis: Beobachtung vorher ankündigen, das Feedback direkt danach geben und mit dem Positiven beginnen. Klär die Nutzung vorab mit Datenschutz und Betriebsrat.</p></section>';
  return tool+'<div class="grid">'+whoCard+teamCard+last+'</div>';
}
function obsCard(e){
  var list=obsOf(e.id),st=obsState(e);
  var head='<div class="card-h"><div><h2>Gesprächsbeobachtung</h2><span class="sub">'+esc(st.l)+'</span></div><button class="btn sm" data-act="obs-new" data-emp="'+esc(e.id)+'">'+ic('plus',14)+' Erfassen</button></div>';

function qual(id){return S.quals.filter(function(q){return q.id===id})[0]}
function qNeeded(e,q){return q.req==='all'||(q.req==='roles'&&q.roles.indexOf(e.role)>-1)}
function qRec(eid,qid){return (S.qrec[eid]||{})[qid]||null}
function qState(e,q){
  var rec=qRec(e.id,q.id),need=qNeeded(e,q);
  if(!rec)return need?{k:'missing',l:'Fehlt',c:'#c92a3a',need:true,rec:null,left:null,due:''}:{k:'na',l:'Nicht erforderlich',c:'#7b8794',need:false,rec:null,left:null,due:''};
  if(!q.valid)return {k:'ok',l:'Gültig · unbefristet',c:'#1f9d55',need:need,rec:rec,left:null,due:''};
  var due=iso(addMonths(parse(rec.date),q.valid)),left=-daysFrom(due);
  if(left<0)return {k:'over',l:'Abgelaufen seit '+(-left)+' '+plural(-left,'Tag','Tagen'),c:'#c92a3a',need:need,rec:rec,left:left,due:due};
  if(left<=60)return {k:'soon',l:'Läuft in '+left+' '+plural(left,'Tag','Tagen')+' ab',c:'#d9780a',need:need,rec:rec,left:left,due:due};
  return {k:'ok',l:'Gültig bis '+fmt(due),c:'#1f9d55',need:need,rec:rec,left:left,due:due};
}
function qIssues(){
  var out=[],ord={over:0,missing:1,soon:2};
  S.employees.forEach(function(e){S.quals.forEach(function(q){var s=qState(e,q);if(s.k==='over'||s.k==='missing'||s.k==='soon')out.push({e:e,q:q,s:s})})});
  return out.sort(function(a,b){return ord[a.s.k]-ord[b.s.k]||(a.s.left||0)-(b.s.left||0)});
}
function qCounts(){
  var c={over:0,missing:0,soon:0,ok:0};
  S.employees.forEach(function(e){S.quals.forEach(function(q){var s=qState(e,q);if(c.hasOwnProperty(s.k))c[s.k]++})});
  return c;
}

/* ===================== Besetzung gegen Kundenfrequenz ===================== */
var LV_L=['ruhig','normal','stark','Spitze'];
function nf(n){return n%1===0?String(n):dec(n,1)}
function staffPeople(){
  return tPeople().filter(function(p){return p.id!=='me'||S.staff.me}).map(function(p){return {id:p.id,name:p.name,role:p.role,w:/^(Auszubildende|Trainee)/.test(p.role)?.5:1}});
}
function shiftRange(code){var m=/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/.exec(shiftTime(code)||'');return m?{a:tmin(m[1]),b:tmin(m[2])}:null}
function presOf(pid,ds){
  if(holiday(ds))return null;
  var d=tDay(pid,ds);
  if(d.kind==='abs'||d.kind==='off')return null;
  if(d.rec&&d.rec.mode==='dev'){var a=tmin(d.rec.from),b=tmin(d.rec.to);return (a!=null&&b!=null&&b>a)?{a:a,b:b}:null}
  var code=pid==='me'?'':cell(ds,pid);
  if(code==='F'||code==='S'){var r=shiftRange(code);if(r&&r.b>r.a)return r}
  if(code==='HO'||code==='BS')return null;
  if(d.plan&&(d.kind===''||d.kind==='plan')){var a2=tmin(d.plan.from),b2=tmin(d.plan.to);if(a2!=null&&b2!=null&&b2>a2)return {a:a2,b:b2}}
  return null;
}
function staffDay(ds){var o=[];staffPeople().forEach(function(p){var r=presOf(p.id,ds);if(r)o.push({p:p,a:r.a,b:r.b})});return o}
function haveAt(list,h){
  var lo=h*60,hi=lo+60,n=0,who=[];
  list.forEach(function(x){if(Math.min(x.b,hi)-Math.max(x.a,lo)>=30){n+=x.p.w;who.push(x)}});
  return {n:n,who:who};
}
function needAt(w,h){var lv=S.staff.freq[w]&&S.staff.freq[w][h];lv=(lv>=0&&lv<=3)?lv:1;return {lv:lv,n:S.staff.req[lv]}}
function staffWeek(ws){
  var out=[];
  for(var i=0;i<5;i++){
    var ds=iso(addDays(parse(ws),i)),hol=holiday(ds),list=hol?[]:staffDay(ds),cells=[];
    if(!hol)for(var h=S.staff.open;h<S.staff.close;h++){var hv=haveAt(list,h),nd=needAt(i,h);cells.push({h:h,have:hv.n,who:hv.who,need:nd.n,lv:nd.lv,short:hv.n<nd.n,res:hv.n>=nd.n+2})}
    out.push({ds:ds,i:i,hol:hol,cells:cells});
  }
  return out;
}
function staffGaps(week){
  var gaps=[];
  week.forEach(function(d){
    var cur=null;
    d.cells.forEach(function(c){
      if(!c.short){cur=null;return}
      var sh=c.need-c.have;
      if(cur&&cur.to===c.h){cur.to=c.h+1;if(sh>cur.worst){cur.worst=sh;cur.min=c.have;cur.need=c.need}}
      else{cur={ds:d.ds,i:d.i,from:c.h,to:c.h+1,worst:sh,min:c.have,need:c.need};gaps.push(cur)}
    });
  });
  return gaps;
}
function gapTxt(g){return WD[g.i]+' '+pad(g.from)+'–'+pad(g.to)+' Uhr'}
function gapSub(g){return nf(g.min)+' statt '+nf(g.need)+' Personen'}
function weekStartOf(ds){return iso(mondayOf(parse(ds)))}
function upcomingGaps(){
  var ws=iso(mondayOf(thisWeekRef())),td=todayISO(),out=[];
  [0,7].forEach(function(o){staffGaps(staffWeek(iso(addDays(parse(ws),o)))).forEach(function(g){if(g.ds>=td)out.push(g)})});
  return out;
}
function staffCell(c,ds){
  return '<button type="button" class="sc-c '+(c.short?'bad':c.res?'res':'ok')+'" data-act="staff-cell" data-d="'+ds+'" data-h="'+c.h+'" aria-label="'+pad(c.h)+' Uhr: '+nf(c.have)+' von '+nf(c.need)+'"><b>'+nf(c.have)+'</b><small>/'+nf(c.need)+'</small></button>';
}
function staffHours(){var a=[];for(var h=S.staff.open;h<S.staff.close;h++)a.push(h);return a}
function dayHead(d){var t=parse(d.ds);return '<div class="sg-h'+(d.ds===todayISO()?' today':'')+(d.hol?' hol':'')+'"><b>'+WD[d.i]+'</b><span>'+pad(t.getDate())+'.'+pad(t.getMonth()+1)+'.</span></div>'}

  if(S.metrics.length&&hasSales(monthKey())&&monthPace(monthKey())>=.3){

    if(bad.length)items.push({sev:2,icon:'chart',c:'#d9780a',t:bad.length+' '+plural(bad.length,'Kennzahl','Kennzahlen')+' deutlich hinter Plan',s:bad.slice(0,3).join(' · '),act:'go',to:'sales'});

function briefExtra(e){
  var o={facts:[],pos:[],themes:[],questions:[]},mk=monthKey();
  if(S.metrics.length){
    var res=personRes(e,mk);
    if(res.entered){
      o.facts.push('Ergebnisse '+monthLabel(mk)+': Ø '+pctTxt(res.avg)+' Zielerreichung ('+res.st.l.toLowerCase()+')');
      res.rows.filter(function(r){return r.st.k==='done'||r.st.k==='ahead'}).slice(0,2).forEach(function(r){o.pos.push('Ergebnis '+r.m.n+': '+fmtV(r.m,r.a)+' von '+fmtV(r.m,r.t.v))});
      res.rows.filter(function(r){return (r.st.k==='bad'||r.st.k==='late')&&monthPace(mk)>=.3}).slice(0,2).forEach(function(r){o.themes.push('Ergebnis '+r.m.n+': '+(r.a==null?'0':fmtV(r.m,r.a))+' von '+fmtV(r.m,r.t.v)+' ('+r.st.l.toLowerCase()+')')});
      var lw=res.rows.filter(function(r){return r.st.k==='bad'||r.st.k==='late'})[0];
      if(lw)o.questions.push('Was würde dir bei „'+lw.m.n+'" helfen, damit du wieder auf Kurs kommst?');
    }
  }
  var ol=obsOf(e.id)[0];
  if(ol){
    var avg=obsPhaseAvg(e.id,3),wk=weakestPhase(avg);
    o.facts.push('Letzte Beobachtung am '+fmt(ol.date)+' ('+ol.kind+'): Ø '+dec(obsMean(ol)));
    if(ol.good)o.pos.push('Aus der Beobachtung: '+shortT(ol.good,140));
    if(ol.focus)o.themes.push('Fokus aus der Beobachtung: '+shortT(ol.focus,140));
    else if(wk)o.themes.push('Beratungsphase mit dem größten Hebel: '+wk.p.n+' (Ø '+dec(wk.v)+')');
    if(ol.next)o.themes.push('Vereinbart nach der Beobachtung: '+shortT(ol.next,120));
  }else if(obsState(e).k==='over')o.themes.push('Noch keine Gesprächsbeobachtung. Eine Hospitation einplanen');
  qIssues().filter(function(x){return x.e.id===e.id}).forEach(function(x){o.themes.push('Nachweis „'+(x.q.s||x.q.n)+'": '+x.s.l.toLowerCase())});
  staleRefs().filter(function(r){return r.empId===e.id}).slice(0,2).forEach(function(r){o.themes.push('Überleitung '+(r.ref||'')+' wartet seit '+refAge(r)+' Tagen auf Rückmeldung')});
  return o;
}
/* ===================== Mein Bereich (To-Dos, Routinen) ===================== */
function weekEndISO(){return iso(addDays(mondayOf(new Date()),6))}
function todoBucket(t){

}
var TODO_GROUPS=[['over','Überfällig','#c92a3a'],['today','Heute','#1c7ed6'],['week','Diese Woche',''],['later','Später',''],['none','Ohne Datum','']];
function openTodos(){return S.todos.filter(function(t){return !t.done})}
function todoStats(){var o={over:0,today:0,focus:0,open:0};openTodos().forEach(function(t){o.open++;var b=todoBucket(t);if(b==='over')o.over++;if(b==='today')o.today++;if(t.focus)o.focus++});return o}

var TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

  return new Promise(function(res,rej){var s=document.createElement('script');s.src=TESS_URL;s.async=true;s.onload=function(){window.Tesseract?res(window.Tesseract):rej(new Error('Texterkennung nicht verfügbar'))};s.onerror=function(){s.remove();rej(new Error('Die Texterkennung konnte nicht geladen werden. Besteht eine Internetverbindung?'))};document.head.appendChild(s)});
}
function prepOcrImage(file){
  return loadImg(file).then(function(o){
    var w=o.img.naturalWidth,h=o.img.naturalHeight,sc=Math.min(2400/Math.max(w,h),Math.max(1,1400/w)),cw=Math.round(w*sc),ch=Math.round(h*sc),c=document.createElement('canvas');c.width=cw;c.height=ch;
    var x=c.getContext('2d');x.drawImage(o.img,0,0,cw,ch);URL.revokeObjectURL(o.url);
    try{var id=x.getImageData(0,0,cw,ch),d=id.data,hist=new Array(256).fill(0),n=cw*ch,i;
      for(i=0;i<d.length;i+=4){var l=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);d[i]=l;hist[l]++}
      var lo=0,hi=255,acc=0;for(i=0;i<256;i++){acc+=hist[i];if(acc>n*.02){lo=i;break}}acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>n*.02){hi=i;break}}
      var mean=0;for(i=0;i<256;i++)mean+=i*hist[i];mean/=n;var inv=mean<110;
      for(i=0;i<d.length;i+=4){var v=clamp(Math.round((d[i]-lo)*255/Math.max(1,hi-lo)),0,255);if(inv)v=255-v;d[i]=d[i+1]=d[i+2]=v}
      x.putImageData(id,0,0)}catch(err){}
    return c;
  });
}
function ocrStatus(t,p){var el=$('#ocrSt');if(el)el.innerHTML='<b>'+esc(t)+'</b>'+(p!=null?'<div class="pbar"><i style="width:'+Math.round(p*100)+'%"></i></div>':'')}

    return T.createWorker('deu',1,{logger:function(m){if(m&&m.status==='recognizing text')ocrStatus('Erkenne Text …',m.progress||0);else if(m&&m.status)ocrStatus(/load|init/i.test(m.status)?'Lade Sprachdaten (nur beim ersten Mal) …':'Bereite vor …',m.progress)}});

function normTxt(s){return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim()}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

  var words=normTxt(line.replace(/\d/g,' ')).split(' ').filter(function(w){return w.length>=3}),best=null,bs=0,tie=false;
  R_().branches.forEach(function(b){
    var toks=normTxt(b.n).split(' ').filter(function(t){return t.length>=3});if(!toks.length)return;
    var hit=toks.filter(function(t){return words.some(function(w){return tokMatch(w,t)})}).length,sc=hit/toks.length+(hit===toks.length?.01*toks.length:0);

function parseNum(tok){
  var s=tok.replace(/[−–]/g,'-').replace(/\s*%$/,'').trim();
  if(/,\d{1,2}$/.test(s)||/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');

function impFromText(text,src){

/* ===================== Interaktion: Gedrückt halten, Aktions-Sheet, Listenzeilen ===================== */
var LP={t:null,x:0,y:0,el:null,block:0};
function lpCancel(){if(LP.t){clearTimeout(LP.t);LP.t=null}if(LP.el){LP.el.classList.remove('lp-press');LP.el=null}}
document.addEventListener('touchstart',function(e){
  var el=e.target.closest&&e.target.closest('[data-lp]');if(!el||e.touches.length>1)return;
  if(e.target.closest('input,select,textarea,.ck,.star-b,.acts2,a[href^="tel:"],a[href^="mailto:"]'))return;
  lpCancel();LP.el=el;LP.x=e.touches[0].clientX;LP.y=e.touches[0].clientY;el.classList.add('lp-press');
  LP.t=setTimeout(function(){var t=LP.el;LP.t=null;if(!t)return;t.classList.remove('lp-press');LP.el=null;LP.block=Date.now();lpOpen(t)},430);
},{passive:true});
document.addEventListener('touchmove',function(e){if(!LP.t)return;var t=e.touches[0];if(Math.abs(t.clientX-LP.x)>9||Math.abs(t.clientY-LP.y)>9)lpCancel()},{passive:true});
document.addEventListener('touchend',function(e){if(LP.t)lpCancel();if(Date.now()-LP.block<700&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('touchcancel',lpCancel,{passive:true});
document.addEventListener('click',function(e){if(Date.now()-LP.block<700){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('contextmenu',function(e){var el=e.target.closest&&e.target.closest('[data-lp]');if(!el)return;e.preventDefault();if(Date.now()-LP.block<700)return;LP.block=Date.now()-400;lpOpen(el)});
function lpOpen(el){
  var fn=LP_MENUS[el.dataset.lp];if(!fn)return;var m=fn(el.dataset.id,el);if(!m||!m.items||!m.items.length)return;
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(err){}
  closePop();openActions(m);
}
function openActions(m){
  UI.lpItems=m.items.filter(Boolean);UI.sheet=true;
  openModal('<div class="as-h">'+(m.head||'')+'<div class="grow" style="min-width:0"><b>'+esc(m.title||'')+'</b>'+(m.sub?'<span class="muted small">'+esc(m.sub)+'</span>':'')+'</div></div><div class="as-l">'+
    UI.lpItems.map(function(it,i){return it.href?'<a class="as-i'+(it.cls?' '+it.cls:'')+'" href="'+esc(it.href)+'" data-act="modal-close"'+(it.ext?' target="_blank" rel="noopener"':'')+'>'+ic(it.icon,19)+'<span>'+esc(it.label)+'</span></a>':'<button type="button" class="as-i'+(it.cls?' '+it.cls:'')+'" data-act="lpa" data-i="'+i+'">'+ic(it.icon,19)+'<span>'+esc(it.label)+'</span></button>'}).join('')+
    '</div><button type="button" class="btn as-x" data-act="modal-close">Abbrechen</button>','sm as');
}

  });

function saveSetForm(kind,f,d){

  else if(kind==='times'){var op=clamp(parseInt(d.get('open'),10)||9,5,22),cl=clamp(parseInt(d.get('close'),10)||18,6,23);if(cl<=op){toast('Schließzeit muss nach der Öffnung liegen','err');return}S.staff.open=op;S.staff.close=cl;
    var a=tm(d.get('fFrom')),b=tm(d.get('fTo')),c=tm(d.get('sFrom')),e=tm(d.get('sTo'));if(a&&b)st.timeF=a+'–'+b;if(c&&e)st.timeS=c+'–'+e}
  else if(kind==='staff'){st.minCoverage=Math.round(clampNum(d.get('min'),3,1,30));S.staff.me=d.get('me')==='1'}
  else if(kind==='rhythm'){st.rhythm=Math.round(clampNum(d.get('rhythm'),42,7,365));st.obsDays=Math.round(clampNum(d.get('obs'),120,14,365));st.refFollow=Math.round(clampNum(d.get('follow'),7,1,60))}

function viewMe(){
  var f=UI.meFilter||'';

  var groups=TODO_GROUPS.map(function(g){
    var it=list.filter(function(t){return todoBucket(t)===g[0]}).sort(function(a,b){return (b.focus-a.focus)||((a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:0)||(['hoch','mittel','niedrig'].indexOf(a.prio)-['hoch','mittel','niedrig'].indexOf(b.prio))});

  }).join('');
  var done=S.todos.filter(function(t){return t.done}).sort(function(a,b){return (b.doneAt||'').localeCompare(a.doneAt||'')});
  var chips=[['','Alle'],['focus','★ Fokus']].concat(TODO_CATS.map(function(c){return [c,c]})).map(function(c){return '<button class="chip pick '+(f===c[0]?'on':'')+'" style="--c:#002D5E" data-act="me-filter" data-v="'+esc(c[0])+'">'+esc(c[1])+'</button>'}).join('');
  var quick='<form class="quick glass rise s12" data-form="qtodo"><input name="t" placeholder="Neues To-Do …" autocomplete="off" required maxlength="200"><select name="due" aria-label="Fällig"><option value="0">Heute</option><option value="1">Morgen</option><option value="w">Diese Woche</option><option value="">Ohne Datum</option></select><button class="btn primary icon" type="submit" aria-label="Hinzufügen">'+ic('plus',18)+'</button></form>';

    (groups||'<p class="muted" style="padding:14px 0">'+(f?'Nichts in diesem Filter.':'Alles erledigt. Stark!')+'</p>')+
    (done.length?'<button class="btn sm ghost" data-act="me-done" style="margin-top:10px">'+(UI.meDone?'Erledigte ausblenden':'Erledigte ('+done.length+')')+'</button>'+(UI.meDone?'<div style="margin-top:6px">'+done.slice(0,25).map(todoRow).join('')+'</div>':''):'')+'</section>';

  }).join('');
  var routCard='<section class="card glass rise"><div class="card-h"><h2>Routinen</h2><button class="btn icon sm ghost" data-act="rout-edit" aria-label="Routinen anpassen">'+ic('edit',16)+'</button></div><div class="pbar"><i style="width:'+(rs.n?Math.round(rs.d/rs.n*100):0)+'%"></i></div>'+(rout||'<p class="muted small">Noch keine Routinen.</p>')+'</section>';
  var wl=wvOpen().filter(function(w){return w.date<=iso(addDays(startOfToday(),7))}).slice(0,5);
  var wvCard='<section class="card glass rise"><div class="card-h"><h2>Wiedervorlage</h2><a class="btn sm" href="#/wv">Alle '+ic('right',14)+'</a></div>'+(wl.length?wl.map(wvRow).join(''):'<p class="muted small">Nichts in den nächsten 7 Tagen.</p>')+'</section>';
  var td=todayISO(),tk=S.tasks.filter(function(t){return t.status!=='done'}),tko=tk.filter(function(t){return t.due&&t.due<td});
  var delCard='<section class="card glass rise"><div class="card-h"><h2>Delegiert</h2><a class="btn sm" href="#/tasks">'+tk.length+' offen '+ic('right',14)+'</a></div>'+

    foot='<div class="m-foot"><button class="btn primary" data-act="imp-edit-done">'+ic('check',15)+' Fertig</button></div>';
  }else{

    var matched=im.rows.filter(function(r){return r.bid&&r.bid!=='__new'}).length;

  var nd=startOfToday(),gd=0;while(!isWorkday(nd)&&gd++<14)nd=addDays(nd,1);
  var t=iso(nd);
  openModal('<div class="m-head"><h3>Abwesenheit erfassen</h3>'+X()+'</div><form data-form="abs" class="form">'+
    SEL('Mitarbeiter','emp',empOpts(false),'','full')+SEL('Art','type',Object.keys(ABS_CODE),'Urlaub')+SEL('Status','status',[['genehmigt','Genehmigt'],['offen','Offen (Antrag)']],'genehmigt')+
    F('Von','from',t,'date','required')+F('Bis','to',t,'date','required')+F('Notiz','note','','text','','full')+
    '<div class="full m-foot" style="margin-top:6px"><button type="button" class="btn" data-act="modal-close">Abbrechen</button><button class="btn primary" type="submit">'+ic('check',15)+' Speichern</button></div></form>');
}
function openTaskForm(id,status,pre){
  var t=id?S.tasks.filter(function(x){return x.id===id})[0]:null;pre=pre||{};
  t=t||{title:pre.title||'',desc:pre.desc||'',empId:'',prio:'mittel',due:'',status:status||'open'};
  openModal('<div class="m-head"><h3>'+(id?'Aufgabe bearbeiten':'Neue Aufgabe')+'</h3>'+X()+'</div><form data-form="task" class="form"><input type="hidden" name="id" value="'+esc(id||'')+'">'+
    F('Titel','title',t.title,'text','required','full')+TA('Beschreibung','desc',t.desc,'full')+
    SEL('Zuständig','emp',empOpts(true),t.empId)+SEL('Priorität','prio',['hoch','mittel','niedrig'],t.prio)+
    F('Fällig am','due',t.due,'date')+SEL('Status','status',COLS.map(function(c){return [c.id,c.l]}),t.status)+
    '<div class="full m-foot" style="margin-top:6px">'+(id?'<button type="button" class="btn danger left" data-act="task-del" data-id="'+esc(id)+'">'+ic('trash',15)+' Löschen</button>':'')+'<button type="button" class="btn" data-act="modal-close">Abbrechen</button><button class="btn primary" type="submit">'+ic('check',15)+' Speichern</button></div></form>');
}
function openGoalForm(id){
  var g=id?S.goals.filter(function(x){return x.id===id})[0]:null;g=g||{name:'',unit:'Stück',target:0,actual:0};
  openModal('<div class="m-head"><h3>'+(id?'Ziel bearbeiten':'Neues Ziel')+'</h3>'+X()+'</div><form data-form="goal" class="form"><input type="hidden" name="id" value="'+esc(id||'')+'">'+
    F('Bezeichnung','name',g.name,'text','required','full')+F('Zielwert (Monat)','target',g.target,'number','min="0" step="any" required')+F('Aktueller Stand','actual',g.actual,'number','min="0" step="any" required')+
    SEL('Aktueller Stand automatisch aus Ergebnissen','metric',[['','– manuell eintragen –']].concat(S.metrics.map(function(m){return [m.id,m.n+' (Summe des Teams, laufender Monat)']})),g.metric||'','full')+
    F('Einheit','unit',g.unit,'text','list="unitList"','full')+'<datalist id="unitList"><option value="Stück"><option value="€"><option value="Punkte"><option value="%"></datalist>'+
    '<div class="full m-foot" style="margin-top:6px">'+(id?'<button type="button" class="btn danger left" data-act="goal-del" data-id="'+esc(id)+'">'+ic('trash',15)+' Löschen</button>':'')+'<button type="button" class="btn" data-act="modal-close">Abbrechen</button><button class="btn primary" type="submit">'+ic('check',15)+' Speichern</button></div></form>');

function setRating(empId,compId,v,toggle){
  var e=emp(empId);if(!e||!comp(compId))return;
  if(v>=1&&v<=5&&!(toggle&&rating(e,compId)===v))e.ratings[compId]=v;else delete e.ratings[compId];
  save();
}

var FORMS={

  emp:function(f,d){
    var name=(d.get('name')||'').trim();if(!name){toast('Bitte einen Namen eingeben','err');return}
    var id=d.get('id'),o={name:name,role:(d.get('role')||'').trim()||'Kundenberater/in',level:d.get('level'),email:(d.get('email')||'').trim(),phone:(d.get('phone')||'').trim(),start:d.get('start')||'',birthday:d.get('birthday')||'',

    save();closeModal();rerender();

  kudos:function(f,d){
    var text=(d.get('text')||'').trim();if(!text){toast('Bitte kurz festhalten, was gut war','err');return}
    if(!d.get('emp')||!emp(d.get('emp'))){toast('Bitte einen Mitarbeiter wählen','err');return}
    S.kudos.push({id:uid(),empId:d.get('emp'),date:todayISO(),tag:d.get('tag')||KUDOS_TAGS[0],text:text});save();closeModal();rerender();toast('Anerkennung gespeichert');
  },
  talk:function(f,d){
    var text=(d.get('text')||'').trim();if(!text){toast('Bitte einen Inhalt eingeben','err');return}
    if(!d.get('emp')||!emp(d.get('emp'))){toast('Bitte einen Mitarbeiter wählen','err');return}
    S.notes.push({id:uid(),empId:d.get('emp'),date:validISO(d.get('date'))?d.get('date'):todayISO(),type:d.get('type'),text:text});

    var o={title:title,empId:d.get('emp'),partnerId:d.get('partner')===d.get('emp')?'':(d.get('partner')||''),type:d.get('type'),compId:d.get('comp')||'',status:d.get('status')||'planned',due:d.get('due')||'',note:(d.get('note')||'').trim()};

/* ============ Events ============ */
document.addEventListener('click',function(e){
  var el=e.target;if(!el||!el.closest)return;
  if(UI.pop&&!el.closest('#pop')&&!el.closest('[data-pop]'))closePop();
  var t=el.closest('[data-act]');if(!t)return;
  var a=el.closest('a[href]');
  if(a&&a!==t&&t.contains(a))return;
  var fn=ACTIONS[t.dataset.act];
  if(fn)fn(t,e)
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#palQ'))closePalette();else openPalette();return}
  if(e.key==='Escape'){if($('#palQ'))closePalette();else if($('#pop'))closePop();else if($('#modal-root').firstChild){closeModal();UI.sheet=false}return}
  if($('#palQ')&&document.activeElement&&document.activeElement.id==='palQ'){
    var n=(UI.palCur||[]).length;
    if(e.key==='ArrowDown'){e.preventDefault();UI.palIdx=Math.min(n-1,UI.palIdx+1);palList()}
    else if(e.key==='ArrowUp'){e.preventDefault();UI.palIdx=Math.max(0,UI.palIdx-1);palList()}
    else if(e.key==='Enter'){e.preventDefault();palRun(UI.palIdx)}
    return;
  }
  if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('[data-act][tabindex]')&&!e.target.matches('button,a,input,select,textarea'))e.target.click();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='palQ'){UI.palQ=t.value;UI.palIdx=0;palList();return}
  var k=t.dataset&&t.dataset.input;if(k&&INPUTS[k])INPUTS[k](t.value);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='importFile'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!Array.isArray(o.employees))throw new Error('format');var n=o.v===2?normalize(o):migrateV1(o);confirmBox('Backup importieren?','Deine aktuellen Daten werden durch den Inhalt der Datei ersetzt ('+n.employees.length+' Mitarbeitende).','Importieren',function(){var keep=S.media.filter(function(m){return !n.media.some(function(x){return x.id===m.id})});n.media=n.media.concat(keep);S=n;save();applyTheme();render();toast('Backup importiert')})}catch(err){toast('Die Datei ist kein gültiges Backup','err')}};
    rd.readAsText(t.files[0]);t.value='';return;
  }
  if(t.id==='icsFile'){var icf=t.files&&t.files[0];t.value='';if(icf)importIcsFile(icf);return}
  if(t.id==='mediaFile'){var mf=t.files;handleMediaFiles(mf);t.value='';return}
  if(t.id==='ocrFile'){var of=t.files&&t.files[0];t.value='';if(of)runOcr(of);return}
  if(t.id==='photoFile'){var pf=t.files&&t.files[0];t.value='';if(pf)handlePhotoInput(pf);return}
  if(t.id==='logoFile'&&t.files&&t.files[0]){
    var f=t.files[0];t.value='';
    if(f.type.indexOf('image/')!==0){toast('Bitte eine Bilddatei wählen','err');return}
    if(f.size>400*1024){toast('Das Logo darf höchstens 400 KB groß sein','err');return}
    var r2=new FileReader();r2.onload=function(){S.settings.logo=String(r2.result);save();rerender();toast('Logo gespeichert')};r2.readAsDataURL(f);return;
  }
  var k=t.dataset&&t.dataset.change;if(k&&CHANGES[k])CHANGES[k](t.value,t);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest&&e.target.closest('form[data-form]');if(!f)return;

});

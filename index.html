<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002D5E">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Filiale Cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23002D5E'/%3E%3Cpath d='M8 22V12l8-5 8 5v10' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --brand-rgb:0,45,94;--tint-rgb:0,45,94;--accent-rgb:188,18,61;
  --brand:rgb(var(--brand-rgb));--tint:rgb(var(--tint-rgb));--accent:rgb(var(--accent-rgb));
  --brand-ink:#002D5E;--btn-a:#0b4a8f;--btn-b:#002D5E;--steel:#8EA5C4;
  --bg1:#eef2f8;--bg2:#e1e8f2;
  --text:#0f1b2d;--muted:#58687e;
  --glass:rgba(255,255,255,.60);--glass-hi:rgba(255,255,255,.80);--glass-strong:rgba(255,255,255,.90);
  --glass-border:rgba(255,255,255,.75);--line:rgba(15,40,80,.13);--field:rgba(255,255,255,.75);
  --shadow:0 10px 32px rgba(0,45,94,.10),0 1px 3px rgba(0,45,94,.07);--radius:22px;
  --edge:rgba(255,255,255,.9);
  --good:#1f9d55;--warn:#d9780a;--bad:#c92a3a;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg1:#050d1a;--bg2:#091a33;
  --text:#e8eef7;--muted:#92a3bb;
  --glass:rgba(24,42,72,.66);--glass-hi:rgba(36,58,96,.62);--glass-strong:rgba(38,62,102,.86);
  --glass-border:rgba(255,255,255,.10);--line:rgba(255,255,255,.13);--field:rgba(0,0,0,.30);
  --shadow:0 12px 36px rgba(0,0,0,.45);--edge:rgba(255,255,255,.14);
  --good:#3ccf7e;--warn:#f5a43a;--bad:#ff6b7a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;background:var(--bg1)}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--brand-ink)}
h1,h2,h3,h4,p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}.nowrap{white-space:nowrap}
.ic{flex:none;vertical-align:middle}
[hidden]{display:none!important}

/* Hintergrund: statisch, kostet keine Rechenzeit */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vmax 46vmax at 6% -8%,rgba(var(--tint-rgb),.20),transparent 62%),
  radial-gradient(46vmax 40vmax at 104% 8%,rgba(var(--accent-rgb),.11),transparent 62%),
  radial-gradient(60vmax 46vmax at 48% 118%,rgba(142,165,196,.40),transparent 62%),
  linear-gradient(160deg,var(--bg1),var(--bg2))}
:root[data-theme=dark] .bg{background:
  radial-gradient(60vmax 46vmax at 6% -8%,rgba(var(--tint-rgb),.20),transparent 62%),
  radial-gradient(46vmax 40vmax at 104% 8%,rgba(var(--accent-rgb),.12),transparent 62%),
  radial-gradient(60vmax 46vmax at 48% 118%,rgba(40,80,140,.22),transparent 62%),
  linear-gradient(160deg,var(--bg1),var(--bg2))}

/* Glas ohne backdrop-filter (nur Overlays blurren) */
.glass{position:relative;background:linear-gradient(165deg,var(--glass-hi),var(--glass));border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.blur{-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.fx{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}
.fx::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(var(--tint-rgb),.17),transparent 58%)}
.fx.is-hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(var(--brand-rgb),.20),inset 0 1px 0 var(--edge)}
.fx.tilt.is-hover{transform:perspective(900px) translateY(-4px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.fx.is-hover::before{opacity:1}

/* Layout */
.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;left:16px;top:16px;bottom:16px;width:262px;display:flex;flex-direction:column;padding:16px 12px;z-index:20}
.main{margin-left:294px;width:calc(100% - 294px);padding:24px 28px 70px 10px;min-width:0}
.wrap{max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 14px}
.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(145deg,var(--btn-a),var(--btn-b));box-shadow:0 8px 20px rgba(var(--brand-rgb),.35),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
.brand small{display:block;font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--accent)}
.brand b{font-size:16px;letter-spacing:-.01em}
.nav{position:relative;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:6px}
.nav::-webkit-scrollbar{display:none}
.nav h6{margin:12px 14px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a .t{display:flex;align-items:center;gap:12px}
.nav a.active{color:var(--text)}
.nav a.active .ic{color:var(--accent)}
.nav .badge-n{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:750;display:grid;place-items:center}
.nav-ind{position:absolute;left:0;top:0;z-index:0;border-radius:13px;background:rgba(var(--tint-rgb),.14);border:1px solid rgba(var(--tint-rgb),.30);box-shadow:inset 0 1px 0 var(--edge);transition:transform .45s cubic-bezier(.2,.9,.3,1.12),width .3s,height .3s}
.nav-ind::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.side-foot{display:flex;gap:8px;align-items:flex-start;padding:11px;border-radius:15px;background:rgba(var(--tint-rgb),.08);font-size:12px;color:var(--muted)}
.tabbar{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:30px;letter-spacing:-.03em;font-weight:760}
.topbar p{color:var(--muted);margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:17px;letter-spacing:-.01em}
.card-h .sub{font-size:13px;color:var(--muted);font-weight:500}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Buttons & Felder */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:13px;border:1px solid var(--glass-border);background:var(--glass-strong);font-weight:650;cursor:pointer;text-decoration:none;color:var(--text);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s,border-color .25s}
.btn:active{transform:scale(.96)}
.btn.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--btn-a),var(--btn-b));box-shadow:0 8px 20px rgba(var(--brand-rgb),.30)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}
.btn.accent{color:#fff;border-color:transparent;background:linear-gradient(135deg,#d3224c,var(--accent));box-shadow:0 8px 20px rgba(var(--accent-rgb),.30)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.icon{padding:0;width:42px;height:42px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}.btn.icon.sm{width:30px;height:30px;padding:0}
.search-btn{color:var(--muted);min-width:210px;justify-content:flex-start}
.search-btn span{flex:1;text-align:left}
kbd{font:600 11px/1 inherit;font-family:inherit;padding:4px 7px;border-radius:7px;background:rgba(127,127,127,.18);color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--field);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tint);box-shadow:0 0 0 4px rgba(var(--tint-rgb),.20)}
textarea{resize:vertical;min-height:70px}
select{appearance:auto}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.02em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form .full{grid-column:1/-1}
.form h4{grid-column:1/-1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
input[type=range]{padding:0;height:28px}

/* Chips, Avatare, Segment */
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;--c:#7b8794;color:var(--text);background:rgba(127,127,127,.15);border:0;font-family:inherit;isolation:isolate}
.chip::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:.16;z-index:-1}
.chip{color:color-mix(in srgb,var(--c) 72%,var(--text))}
.chip.pick{cursor:pointer;transition:transform .2s}
.chip.pick.on{color:#fff}
.chip.pick.on::before{opacity:1}
.chip.pick:active{transform:scale(.95)}
.avatar{--g1:#0b4a8f;--g2:#002D5E;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:750;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.14)}
.avatar.xl{width:84px;height:84px;border-radius:28px;font-size:30px}
.avatar.lg{width:60px;height:60px;border-radius:20px;font-size:21px}.avatar.sm{width:28px;height:28px;border-radius:10px;font-size:11px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:15px;background:rgba(127,127,127,.12);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:11px;font-weight:650;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--glass-strong);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.searchbox{position:relative;flex:1;min-width:220px;max-width:380px}
.searchbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-left:40px}
.sp{flex:1}

/* Dashboard */
.hero{padding:28px 30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.16),transparent 66%);pointer-events:none}
.hero h2{font-size:31px;letter-spacing:-.035em;margin-bottom:6px}
.hero p{max-width:640px;color:var(--muted);font-size:16px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.datebox{position:relative;z-index:1;width:128px;height:128px;border-radius:32px;display:grid;place-content:center;text-align:center;color:#fff;background:linear-gradient(145deg,var(--btn-a),var(--btn-b));box-shadow:0 18px 40px rgba(var(--brand-rgb),.35),inset 0 1px 0 rgba(255,255,255,.4)}
.datebox::after{content:"";position:absolute;left:22px;right:22px;bottom:12px;height:3px;border-radius:3px;background:var(--accent)}
.datebox b{font-size:44px;line-height:1;letter-spacing:-.04em}.datebox span{font-size:13px;opacity:.92;font-weight:650}.datebox small{font-size:11px;opacity:.75;letter-spacing:.1em}
.tile{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text)}
.tile .ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(var(--c-rgb,var(--tint-rgb)),.14);color:rgb(var(--c-rgb,var(--tint-rgb)))}
.tile .big{font-size:36px;font-weight:760;letter-spacing:-.035em;line-height:1}
.tile .lab{color:var(--muted);font-weight:600}
.tile .sub{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;margin:0 -12px;border-radius:15px;transition:background .2s}
.row.click{cursor:pointer}
.row .grow{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .badge{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--c-rgb,var(--tint-rgb)),.13);color:rgb(var(--c-rgb,var(--tint-rgb)));flex:none}
.bar{position:relative;height:9px;border-radius:99px;background:rgba(127,127,127,.18)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--btn-a),var(--tint));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i.good{background:linear-gradient(90deg,#2fb36b,var(--good))}.bar i.warn{background:linear-gradient(90deg,#f0a43a,var(--warn))}.bar i.bad{background:linear-gradient(90deg,#e0566b,var(--bad))}
.bar b.pace{position:absolute;top:-4px;width:2px;height:17px;border-radius:2px;background:var(--accent)}
.prow{padding:7px 0}.prow .l{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:600;font-size:14px;gap:8px}
.empty{padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .ico{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:rgba(var(--tint-rgb),.12);color:var(--tint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* Team */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.emp{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:13px}
.emp .head{display:flex;gap:14px;align-items:center}
.emp h3{font-size:18px;letter-spacing:-.02em}
.emp .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:11px;border-radius:15px;background:rgba(127,127,127,.09)}
.emp .stats div{text-align:center}.emp .stats b{display:block;font-size:18px;letter-spacing:-.02em}.emp .stats span{font-size:11px;color:var(--muted)}
.emp .acts{display:flex;gap:8px}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}

/* Person */
.ph{padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.ph h2{font-size:26px;letter-spacing:-.03em}
.ph .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.kv div{padding:14px;border-radius:16px;background:rgba(127,127,127,.09);text-align:center}
.kv b{display:block;font-size:22px;letter-spacing:-.02em}.kv span{font-size:12px;color:var(--muted)}
.radar{width:100%;height:auto;max-width:560px;display:block;margin:0 auto}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}
.rd-ax{stroke:var(--line);stroke-width:1}
.rd-ist{fill:rgba(var(--tint-rgb),.24);stroke:var(--tint);stroke-width:2.2;stroke-linejoin:round}
.rd-soll{fill:none;stroke:var(--accent);stroke-width:1.7;stroke-dasharray:5 4}
.rd-dot{fill:var(--tint);stroke:var(--glass-strong);stroke-width:2}
.rd-l{font-size:11px;fill:var(--muted);font-weight:600}
.rd-n{font-size:10px;fill:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(var(--tint-rgb),.10)}
.tag.good{background:rgba(31,157,85,.14)}.tag.gap{background:rgba(var(--accent-rgb),.11)}
.tag em{font-style:normal;font-weight:750;opacity:.8}
.crow{display:grid;grid-template-columns:minmax(150px,1fr) auto 90px;gap:12px;align-items:center;padding:9px 12px;margin:0 -12px;border-radius:15px;transition:background .2s}
.crow .cn b{display:block;font-size:14px}.crow .cn span{font-size:12px;color:var(--muted)}
.rate{display:flex;gap:6px}
.rate button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--field);font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.rate button:active{transform:scale(.92)}
.rate button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--btn-a),var(--btn-b))}
.rate button.soll{outline:2px dashed rgba(var(--accent-rgb),.75);outline-offset:2px}
.delta{font-size:13px;font-weight:700;text-align:right}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.eq{color:var(--muted)}
.sg{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 4px}
.note{padding:12px 14px;border-radius:14px;background:rgba(127,127,127,.09);margin-bottom:8px}
.note .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;color:var(--muted);font-weight:650;gap:8px}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(127,127,127,.08);margin-bottom:8px;cursor:pointer}
.mrow .grow{flex:1;min-width:0}.mrow b{display:block}

/* Matrix */
.matrix-wrap{overflow:auto;border-radius:16px;max-height:calc(100vh - 260px)}
table.matrix{border-collapse:separate;border-spacing:4px;min-width:880px;width:100%}
.matrix th{font-weight:650;font-size:12px;color:var(--muted);text-align:center;vertical-align:bottom;padding:2px}
.matrix th.vh{height:150px}
.matrix th.vh span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;padding:4px 0}
.matrix thead th.who{background:transparent;box-shadow:none}.matrix th.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--line);padding-bottom:4px}
.matrix td{padding:0;text-align:center}
.matrix td.who,.matrix th.who{position:sticky;left:0;z-index:2;text-align:left;background:var(--glass-strong);border-radius:12px;padding:6px 10px;min-width:170px}
.matrix td.who .w{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:650;font-size:14px}
.mc{position:relative;width:100%;min-width:38px;height:38px;border-radius:11px;border:0;font-weight:750;font-size:14px;cursor:pointer;color:var(--text);transition:transform .15s}
.mc:active{transform:scale(.92)}
.mc.low::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--glass-strong)}
.mc.hi{color:#fff}
:root[data-theme=dark] .mc.hi{color:#06142b}
.matrix tfoot td{padding:6px 2px;font-size:13px;font-weight:700;color:var(--muted)}

/* 9-Box */
.nine{display:grid;grid-template-columns:26px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(104px,auto)) 26px;gap:8px}
.nine .bx{border-radius:16px;padding:9px 10px;background:rgba(var(--tint-rgb),.07);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.nine .bx h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nine .bx.hot{background:rgba(31,157,85,.10)}.nine .bx.cold{background:rgba(var(--accent-rgb),.07)}
.nine .ax{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:grid;place-items:center}
.nine .ax.y{writing-mode:vertical-rl;transform:rotate(180deg);grid-column:1;grid-row:1/4}
.nine .ax.x{grid-column:2/5;grid-row:4}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs .avatar{cursor:pointer}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.col{padding:16px;min-height:300px;outline:2px dashed transparent;outline-offset:-6px;transition:outline-color .2s}
.col.over{outline-color:var(--tint)}
.col header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.col header h3{font-size:16px;flex:1}
.count{min-width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(var(--tint-rgb),.14);font-size:13px;font-weight:750;color:var(--brand-ink)}
:root[data-theme=dark] .count{color:var(--text)}
.col-body{display:flex;flex-direction:column;gap:10px}
.task{padding:14px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--glass-border);cursor:grab;display:flex;flex-direction:column;gap:9px;transition:transform .25s,box-shadow .25s}
.task.dragging{opacity:.4;transform:scale(.97)}
.t-top{display:flex;gap:10px;align-items:flex-start}.t-top b{flex:1}
.prio{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--c);box-shadow:0 0 0 4px rgba(127,127,127,.15)}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.quick{display:flex;gap:10px;padding:12px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.quick input{flex:1;min-width:200px}.quick select{width:auto;min-width:170px}

/* Synergien */
.pair{padding:20px;display:flex;flex-direction:column;gap:14px}
.pair .heads{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}.pair .swap{margin-top:3px}
.pair .p{display:flex;gap:10px;align-items:center;min-width:0}.pair .p b{display:block;overflow-wrap:anywhere;line-height:1.25}.pair .p .muted{display:block;line-height:1.25}
.pair .swap{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);color:var(--accent)}
.pair .give{padding:11px 13px;border-radius:14px;background:rgba(127,127,127,.08);font-size:13px}
.pair .give .skills{margin-top:6px}
.cov{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(120px,1fr) auto;gap:12px;align-items:center;padding:9px 12px;margin:0 -12px;border-radius:14px}
.avrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* Überleitungen */
.chan{padding:20px;display:flex;flex-direction:column;gap:12px}
.chan .top{display:flex;align-items:center;gap:12px}
.chan .ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(127,127,127,.12);color:var(--c)}
.chan .ico::before{content:none}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.funnel div{padding:9px 4px;border-radius:13px;background:rgba(127,127,127,.09)}
.funnel b{display:block;font-size:19px;letter-spacing:-.02em}.funnel span{font-size:11px;color:var(--muted)}
.rr{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:0 -14px;border-radius:16px;transition:background .2s}
.rr .grow{flex:1;min-width:0}.rr .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .acts{display:flex;gap:6px;align-items:center}
.rr select{width:auto;padding:6px 10px;font-size:13px}

/* Dienstplan */
.scroll-x{overflow-x:auto;padding-bottom:6px}
.sched{min-width:800px;display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(5,minmax(106px,1fr)) 64px;gap:8px;align-items:center}
.sched .hd{text-align:center;padding:9px 4px;border-radius:14px;line-height:1.25}
.sched .hd b{display:block;font-size:14px}.sched .hd span{font-size:12px;color:var(--muted)}.sched .hd em{display:block;font-size:11px;font-style:normal;color:var(--accent);font-weight:650}
.sched .hd.today{background:rgba(var(--tint-rgb),.16)}.sched .hd.hol{background:rgba(var(--accent-rgb),.09)}
.sched .whoc{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:14px}
.sched .whoc small{display:block;color:var(--muted);font-size:12px}
.cell{width:100%;height:56px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s}
.cell:active{transform:scale(.94)}
.cell.filled{--c:#888;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.14);color:var(--text)}
.cell.filled{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--text))}
.cell b{font-size:14px}.cell small{font-size:11px;opacity:.8}
.cell.ft{display:grid;place-items:center;height:56px;border-radius:14px;background:rgba(var(--accent-rgb),.08);color:var(--accent);font-size:12px;font-weight:650;cursor:default}
.cnt{text-align:center;font-weight:700;color:var(--muted)}
.cov-label{font-weight:700;padding:4px 6px}
.covc{display:grid;place-items:center;height:40px;border-radius:12px;font-weight:750}
.pop{position:fixed;z-index:120;width:230px;padding:8px;display:flex;flex-direction:column;gap:2px;animation:pop .2s cubic-bezier(.2,.9,.3,1.3);background:var(--glass-strong)}
.pop-h{padding:8px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.pop button{display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:11px;background:transparent;cursor:pointer;text-align:left;font-weight:600}
.pop button i{width:12px;height:12px;border-radius:5px;background:var(--c,#888)}
.pop button small{margin-left:auto;color:var(--muted);font-size:11px}
.pop button.on{background:rgba(var(--tint-rgb),.16)}
.pop button.clear{color:var(--muted);margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 11px 11px}
.pop .rate{padding:6px 8px 8px}
.abs{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:0 -14px;border-radius:16px;flex-wrap:wrap}
.abs .grow{flex:1;min-width:180px}
.abs .acts{display:flex;gap:6px}
.vac{padding:10px 0}.vac .l{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:10px}
.vac .l span{display:flex;align-items:center;gap:10px;font-weight:650}

/* Ziele */
.goal{padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;text-align:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring-bg{stroke:rgba(127,127,127,.2)}
.ring-fg{stroke:var(--rc,var(--tint));transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:760;letter-spacing:-.03em}
.goal h3{font-size:16px}

/* Einstellungen */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=color]{width:48px;height:38px;padding:2px;border-radius:12px;cursor:pointer}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.ce{display:grid;grid-template-columns:minmax(0,1fr) 120px 74px 38px;gap:8px;align-items:center;padding:5px 0}
.ce select,.ce input{padding:8px 10px;font-size:14px}

/* Modal, Palette, Toast */
.modal-back{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(5,14,30,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s}
.modal{width:min(680px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:26px;animation:pop .3s cubic-bezier(.2,.9,.3,1.2);--radius:26px;background:var(--glass-strong)}
.modal.sm{width:min(440px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.m-head h3{font-size:22px;letter-spacing:-.02em}
.m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.m-foot .left{margin-right:auto}
.sheet a{display:flex;align-items:center;gap:14px;padding:14px;border-radius:15px;text-decoration:none;color:var(--text);font-weight:650;background:rgba(127,127,127,.08);margin-bottom:8px}
.sheet a .ic{color:var(--accent)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.pal-back{position:fixed;inset:0;z-index:110;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;background:rgba(5,14,30,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s}
.pal{width:min(600px,100%);animation:pop .25s cubic-bezier(.2,.9,.3,1.2);background:var(--glass-strong)}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{border:0;background:transparent;box-shadow:none!important;padding:0;font-size:17px}
.pal-list{max-height:340px;overflow:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;cursor:pointer}
.pal-item.on{background:rgba(var(--tint-rgb),.16)}
.pal-item .k{margin-left:auto;font-size:11px;color:var(--muted);font-weight:650}
.pal-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:13px 18px;--radius:16px;animation:slide .35s cubic-bezier(.2,.9,.3,1.2);font-weight:600;background:var(--glass-strong)}
.toast.ok .ic{color:var(--good)}.toast.err .ic{color:var(--bad)}.toast.warn .ic{color:var(--warn)}
.toast.out{opacity:0;transform:translateX(30px);transition:.3s}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* Nur Maus/Trackpad: Hover-Effekte. Auf Touch-Geräten gibt es bewusst keine Hover-Regeln. */
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 8px 22px rgba(var(--brand-rgb),.22);border-color:rgba(var(--tint-rgb),.5)}
  .btn.primary:hover::after{transform:translateX(130%)}
  .btn.danger:hover{background:rgba(201,42,58,.12);border-color:rgba(201,42,58,.45)}
  .btn.ghost:hover{background:var(--glass-strong)}
  input:hover,select:hover,textarea:hover{border-color:rgba(var(--tint-rgb),.5)}
  .nav a{transition:color .2s}
  .nav a .ic{transition:transform .3s cubic-bezier(.2,.9,.3,1.5)}
  .nav a:hover{color:var(--text)}
  .nav a:hover .t,.nav a:hover>.ic{transform:translateX(4px)}
  .nav a .t{transition:transform .25s}
  .nav a:hover .ic{transform:scale(1.15) rotate(-6deg)}
  .tile:hover .ico{transform:rotate(-8deg) scale(1.12)}
  .tile .ico{transition:transform .3s cubic-bezier(.2,.9,.3,1.5)}
  .row:hover,.crow:hover,.abs:hover,.rr:hover,.cov:hover{background:rgba(var(--tint-rgb),.09)}
  .row>*,.rr>*{transition:transform .25s}
  .row:hover .badge,.row:hover>.grow{transform:translateX(3px)}
  .row.click:hover{background:rgba(var(--tint-rgb),.11)}
  .mrow:hover{background:rgba(var(--tint-rgb),.11)}
  .emp .acts{opacity:0;transform:translateY(6px);transition:.25s}
  .emp:hover .acts,.emp:focus-within .acts,.emp.is-hover .acts{opacity:1;transform:none}
  .mc:hover{transform:scale(1.14);z-index:3;box-shadow:0 6px 16px rgba(var(--brand-rgb),.35)}
  .cell:hover{transform:scale(1.06);border-color:var(--tint);background:rgba(var(--tint-rgb),.10);box-shadow:0 8px 20px rgba(var(--brand-rgb),.18)}
  .rate button:hover{transform:translateY(-2px);border-color:var(--tint)}
  .task:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(var(--brand-rgb),.18);border-color:rgba(var(--tint-rgb),.5)}
  .pop button:hover,.pal-item:hover{background:rgba(var(--tint-rgb),.14)}
  .chip.pick:hover{transform:translateY(-2px)}
  .seg button:hover{color:var(--text)}
  .swatch:hover{transform:scale(1.15)}
  .avs .avatar:hover{transform:scale(1.15);transition:transform .2s}
  .note:hover{background:rgba(var(--tint-rgb),.09)}
  .sheet a:hover{background:rgba(var(--tint-rgb),.12)}
}
.swatch{width:36px;height:36px;border-radius:12px;border:2px solid transparent;background:var(--c);cursor:pointer;transition:transform .2s}
.swatch.on{border-color:var(--text)}

/* Responsive */
@media (max-width:1180px){.s8,.s7,.s5,.s4{grid-column:span 12}.s3{grid-column:span 6}.set-grid{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .sidebar{display:none}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;padding:6px;border-radius:26px;justify-content:space-between;gap:2px;background:var(--glass-strong)}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;background:transparent;border-radius:20px;font-size:10.5px;font-weight:650;color:var(--muted);text-decoration:none;cursor:pointer;min-width:0}
  .tabbar a.active{color:var(--text);background:rgba(var(--tint-rgb),.16)}
  .tabbar a.active .ic{color:var(--accent)}
  .main{margin-left:0;width:100%;padding:16px 14px calc(110px + env(safe-area-inset-bottom))}
  .hero{grid-template-columns:1fr;padding:22px}.datebox{display:none}
  .kanban{grid-template-columns:1fr}
  .search-btn{min-width:0}.search-btn span,.search-btn kbd{display:none}.search-btn{width:42px;padding:10px;justify-content:center}
  .topbar h1{font-size:25px}
  .ph{grid-template-columns:auto 1fr;padding:18px}.ph .btns{grid-column:1/-1;justify-content:flex-start}
  .crow{grid-template-columns:1fr;gap:8px}.crow .delta{text-align:left}
  .cov{grid-template-columns:1fr;gap:6px}
  .pair .heads{grid-template-columns:1fr;justify-items:start}.pair .swap{transform:rotate(90deg)}
  #toast-root{bottom:calc(96px + env(safe-area-inset-bottom));right:12px}
  .ce{grid-template-columns:minmax(0,1fr) 90px 62px 36px}
  .nine{grid-template-columns:22px repeat(3,minmax(0,1fr));gap:5px}
}
@media (max-width:560px){.s3{grid-column:span 6}.form{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}.tile .big{font-size:30px}.hero h2{font-size:25px}.funnel{grid-template-columns:repeat(2,1fr)}.emp-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.noanim .rise{animation:none!important}

</style>
</head>

<div class="shell">

    <div class="side-foot" id="sideFoot"></div>

  <main class="main">
    <div class="wrap">
      <header class="topbar">
        <div><h1 id="pageTitle">Übersicht</h1><p id="pageSub"></p></div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <div id="view"></div>

</div>
<nav class="tabbar glass blur" id="tabbar" aria-label="Navigation"></nav>
<div id="modal-root"></div>
<div id="pal-root"></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>

/* ============ Fachlogik ============ */
function emp(id){return S.employees.filter(function(e){return e.id===id})[0]}
function comp(id){return S.comps.filter(function(c){return c.id===id})[0]}
function chan(id){return S.channels.filter(function(c){return c.id===id})[0]}
function rating(e,cid){var v=e.ratings&&e.ratings[cid];return (v>=1&&v<=5)?v:0}
function soll(e,c){return clamp(c.t+(LEVELS[e.level]||0),1,5)}
function avgIst(e){var a=0,n=0;S.comps.forEach(function(c){var v=rating(e,c.id);if(v){a+=v;n++}});return n?a/n:0}
function fulfil(e){var a=0,b=0;S.comps.forEach(function(c){var v=rating(e,c.id);if(!v)return;var s=soll(e,c);a+=Math.min(v,s);b+=s});return b?a/b:0}
function gapsOf(e){
  return S.comps.map(function(c){return {c:c,is:rating(e,c.id),soll:soll(e,c)}}).filter(function(x){return x.is&&x.soll-x.is>0}).map(function(x){x.gap=x.soll-x.is;return x}).sort(function(a,b){return b.gap-a.gap||a.is-b.is});
}
function strongOf(e){
  return S.comps.map(function(c){return {c:c,is:rating(e,c.id),soll:soll(e,c)}}).filter(function(x){return x.is>=4}).sort(function(a,b){return b.is-a.is||(b.is-b.soll)-(a.is-a.soll)});
}
function mentorLoad(id){return S.meas.filter(function(m){return m.type==='Tandem'&&m.partnerId===id&&m.status!=='done'}).length}
function mentorsFor(e,c){
  return S.employees.filter(function(x){return x.id!==e.id&&rating(x,c.id)>=4&&rating(x,c.id)>rating(e,c.id)})
    .sort(function(a,b){return rating(b,c.id)-rating(a,c.id)||mentorLoad(a.id)-mentorLoad(b.id)});
}
function tandemExists(learnerId,partnerId,compId){return S.meas.some(function(m){return m.type==='Tandem'&&m.empId===learnerId&&m.partnerId===partnerId&&m.compId===compId&&m.status!=='done'})}
function tandemGives(x,y){
  return S.comps.filter(function(c){var ry=rating(y,c.id),rx=rating(x,c.id);return rx>=4&&ry>0&&rx>ry&&soll(y,c)-ry>=1})
    .sort(function(p,q){return (soll(y,q)-rating(y,q.id))-(soll(y,p)-rating(y,p.id))});
}
function tandems(){
  var out=[],L=S.employees;
  for(var i=0;i<L.length;i++)for(var j=i+1;j<L.length;j++){
    var a=L[i],b=L[j],ga=tandemGives(a,b),gb=tandemGives(b,a);
    if(!ga.length&&!gb.length)continue;
    out.push({a:a,b:b,aGives:ga,bGives:gb,mutual:ga.length>0&&gb.length>0,score:ga.length+gb.length+(ga.length&&gb.length?3:0)});
  }
  return out.sort(function(p,q){return q.score-p.score});
}
function createTandem(p){
  var n=0;
  function mk(teacher,learner,list){list.slice(0,2).forEach(function(c){
    if(tandemExists(learner.id,teacher.id,c.id))return;
    S.meas.push({id:uid(),empId:learner.id,partnerId:teacher.id,type:'Tandem',compId:c.id,title:c.n+': Tandem mit '+teacher.name.split(' ')[0],status:'planned',due:iso(addDays(new Date(),60)),note:''});n++;
  })}
  mk(p.a,p.b,p.aGives);mk(p.b,p.a,p.bGives);
  return n;
}
function coverageOf(c){
  var ex=S.employees.filter(function(e){return rating(e,c.id)>=4});
  var cand=S.employees.filter(function(e){return rating(e,c.id)===3});
  return {experts:ex,cand:cand,kind:ex.length===0?'gap':ex.length===1?'single':'ok'};
}
function teamAvg(c){var a=0,n=0;S.employees.forEach(function(e){var v=rating(e,c.id);if(v){a+=v;n++}});return n?a/n:0}
function teamSoll(c){var a=0,n=0;S.employees.forEach(function(e){if(rating(e,c.id)){a+=soll(e,c);n++}});return n?a/n:c.t}
function talkTime(e){
  var l=S.notes.filter(function(n){return n.empId===e.id&&n.type!=='Sonstiges'&&validISO(n.date)}).map(function(n){return n.date}).sort();
  return l.length?l[l.length-1]:'';
}
function talkState(e){
  var last=talkTime(e),r=S.settings.rhythm||42;
  if(!last){var fresh=e.start&&validISO(e.start)&&daysFrom(e.start)<30&&daysFrom(e.start)>=0;return fresh?{k:'new',l:'Neu im Team',c:'#1c7ed6',last:'',days:null}:{k:'over',l:'Noch kein Gespräch',c:'#c92a3a',last:'',days:null}}
  var d=daysFrom(last);
  if(d>r)return {k:'over',l:'Überfällig · '+d+' Tage',c:'#c92a3a',last:last,days:d};
  if(d>r*0.75)return {k:'soon',l:'Bald fällig · '+d+' Tage',c:'#d9780a',last:last,days:d};
  return {k:'ok',l:'Aktuell · vor '+d+' Tagen',c:'#1f9d55',last:last,days:d};
}
function refsOf(f){return S.refs.filter(function(r){return (!f.emp||r.empId===f.emp)&&(!f.ch||r.channel===f.ch)&&(!f.status||r.status===f.status)&&(!f.days||daysFrom(r.date)<=f.days)&&(!f.month||String(r.date).slice(0,7)===f.month)})}
function refStats(list){
  var c={handed:0,appt:0,won:0,lost:0};list.forEach(function(r){if(c.hasOwnProperty(r.status))c[r.status]++});
  var closed=c.won+c.lost;return {n:list.length,c:c,rate:closed?c.won/closed:null,open:c.handed+c.appt};
}
function underused(){
  var out=[];
  S.channels.forEach(function(ch){
    if(!ch.comp||!comp(ch.comp))return;
    S.employees.forEach(function(e){
      if(rating(e,ch.comp)>=4&&refsOf({emp:e.id,ch:ch.id,days:90}).length===0)out.push({e:e,ch:ch});

/* Dienstplan-Logik */
function cell(d,id){return holiday(d)?'FT':((S.schedule[d]||{})[id]||'')}
function setCell(d,id,code){if(!S.schedule[d])S.schedule[d]={};if(code)S.schedule[d][id]=code;else delete S.schedule[d][id]}
function coverage(d){var m=S.schedule[d]||{};return S.employees.filter(function(e){return m[e.id]==='F'||m[e.id]==='S'}).length}
function applyAbsence(a){var c=ABS_CODE[a.type]||'FR';workdaysBetween(a.from,a.to).forEach(function(d){setCell(d,a.empId,c)})}
function clearAbsence(a){var c=ABS_CODE[a.type]||'FR';workdaysBetween(a.from,a.to).forEach(function(d){if((S.schedule[d]||{})[a.empId]===c)setCell(d,a.empId,'')})}
function vacationUsed(id,y){var n=0;S.absences.forEach(function(a){if(a.empId===id&&a.type==='Urlaub'&&a.status==='genehmigt'){n+=workdaysBetween(a.from,a.to).filter(function(d){return d.indexOf(y+'-')===0}).length}});return n}
function vacationPending(id,y){var n=0;S.absences.forEach(function(a){if(a.empId===id&&a.type==='Urlaub'&&a.status==='offen'){n+=workdaysBetween(a.from,a.to).filter(function(d){return d.indexOf(y+'-')===0}).length}});return n}
function lowDays(from,to){return workdaysBetween(from,to).filter(function(d){return S.schedule[d]&&Object.keys(S.schedule[d]).length>0&&coverage(d)<S.settings.minCoverage})}
function dayStatus(ds,id){
  var d=parse(ds),w=d.getDay();
  if(w===0||w===6)return {l:'Wochenende',c:'#7b8794'};
  if(holiday(ds))return {l:'Feiertag',c:'#d6336c'};
  var c=(S.schedule[ds]||{})[id];
  if(c&&SHIFTS[c])return {l:SHIFTS[c].l,c:SHIFTS[c].c};
  return {l:'Nicht geplant',c:'#7b8794'};
}
function chipStatus(ds,id){var s=dayStatus(ds,id);return '<span class="chip" style="--c:'+s.c+'">'+esc(s.l)+'</span>'}
function shiftTime(c){return c==='F'?S.settings.timeF:c==='S'?S.settings.timeS:''}
function goalPct(g){return g.target>0?g.actual/g.target:0}
function goalState(g){
  var n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),pace=n.getDate()/dim,p=goalPct(g);
  if(p>=1)return {l:'Ziel erreicht',c:'#1f9d55',pace:pace};
  if(p>=pace+.05)return {l:'Voraus',c:'#1f9d55',pace:pace};
  if(p>=pace-.1)return {l:'Im Plan',c:'#1c7ed6',pace:pace};
  if(p>=pace-.25)return {l:'Leicht hinter Plan',c:'#d9780a',pace:pace};
  return {l:'Hinter Plan',c:'#c92a3a',pace:pace};
}

/* ============ Theme ============ */
function hexOk(h){return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h||'')}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]}
function mixTo(rgb,t,k){return rgb.map(function(v){return Math.round(v+(t-v)*k)})}
function applyTheme(){
  var st=S.settings,p=hexToRgb(hexOk(st.primary)?st.primary:BRAND_DEF.primary),a=hexToRgb(hexOk(st.accent)?st.accent:BRAND_DEF.accent),r=document.documentElement;
  var dark=st.theme==='dark'||(st.theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'dark':'light';
  var tint=dark?mixTo(p,255,.5):p,acc=dark?mixTo(a,255,.22):a;
  r.style.setProperty('--brand-rgb',p.join(','));
  r.style.setProperty('--tint-rgb',tint.join(','));
  r.style.setProperty('--accent-rgb',acc.join(','));
  r.style.setProperty('--brand-ink','rgb('+(dark?mixTo(p,255,.6):p).join(',')+')');
  r.style.setProperty('--btn-a','rgb('+mixTo(p,255,dark?.38:.22).join(',')+')');
  r.style.setProperty('--btn-b','rgb('+(dark?mixTo(p,255,.12):p).join(',')+')');
  var m=$('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#050d1a':'rgb('+p.join(',')+')');
}
function rgbOf(hex){return hexToRgb(hexOk(hex)?hex:'#7b8794').join(',')}

/* ============ Hover-Effekte (nur Maus, nie Touch) ============ */
var FX={el:null,rest:null,raf:0,ev:null};
function fxRelease(){
  if(!FX.el)return;
  FX.el.classList.remove('is-hover');FX.el.style.removeProperty('--rx');FX.el.style.removeProperty('--ry');
  FX.el=null;FX.rest=null;
}
function fxUpdate(x,y){
  var el=FX.el,r=FX.rest;if(!el||!r)return;
  el.style.setProperty('--mx',(x-r.left).toFixed(0)+'px');el.style.setProperty('--my',(y-r.top).toFixed(0)+'px');
  if(el.classList.contains('tilt')){
    var px=(x-r.left)/Math.max(1,r.width),py=(y-r.top)/Math.max(1,r.height);
    el.style.setProperty('--rx',((.5-py)*5).toFixed(2)+'deg');el.style.setProperty('--ry',((px-.5)*7).toFixed(2)+'deg');
  }
}
function fxFrame(){
  FX.raf=0;var e=FX.ev;if(!e||!e.target||!e.target.closest)return;
  var x=e.clientX,y=e.clientY;
  if(FX.el){
    var r=FX.rest;
    if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6){fxUpdate(x,y);return}
    fxRelease();
  }
  var t=e.target.closest('.fx');if(!t)return;
  FX.el=t;FX.rest=t.getBoundingClientRect();t.classList.add('is-hover');fxUpdate(x,y);
}

function sparkline(vals,w,h){
  if(vals.length<2)return '';
  var min=Math.min.apply(null,vals)-.2,max=Math.max.apply(null,vals)+.2,pts=vals.map(function(v,i){return [(i/(vals.length-1))*(w-8)+4,h-4-((v-min)/(max-min))*(h-8)]});
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Entwicklung des Durchschnitts"><polyline fill="none" stroke="var(--tint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>'+pts.map(function(p,i){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.8)+'" fill="'+(i===pts.length-1?'var(--accent)':'var(--tint)')+'"/>'}).join('')+'</svg>';
}
function radar(e){
  var cs=S.comps,n=cs.length;
  if(n<3)return '<p class="muted">Für das Netzdiagramm werden mindestens 3 Kompetenzen benötigt.</p>';
  var W=560,H=430,cx=W/2,cy=H/2+4,R=138,i,lv;
  function pt(i,v,k){var a=-Math.PI/2+i*2*Math.PI/n,r=R*(v/5)*(k||1);return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  function poly(vals){return vals.map(function(v,i){var p=pt(i,v);return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
  var g='';
  for(lv=1;lv<=5;lv++){g+='<polygon class="rd-grid" points="'+poly(cs.map(function(){return lv}))+'"/>'}
  for(i=0;i<n;i++){var p=pt(i,5);g+='<line class="rd-ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'}
  var ist=cs.map(function(c){return rating(e,c.id)}),sl=cs.map(function(c){return soll(e,c)});
  g+='<polygon class="rd-soll" points="'+poly(sl)+'"/><polygon class="rd-ist" points="'+poly(ist)+'"/>';
  cs.forEach(function(c,i){
    var v=ist[i],p=pt(i,v),a=-Math.PI/2+i*2*Math.PI/n,lx=cx+(R+18)*Math.cos(a),ly=cy+(R+18)*Math.sin(a),co=Math.cos(a),si=Math.sin(a);
    var anchor=co>.25?'start':co<-.25?'end':'middle',dy=si>.6?'.8em':si<-.6?'-.2em':'.35em';
    if(v)g+='<circle class="rd-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5"><title>'+esc(c.n)+': Ist '+v+' · Soll '+sl[i]+'</title></circle>';
    g+='<text class="rd-l" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" dy="'+dy+'" text-anchor="'+anchor+'">'+esc(c.s||c.n)+'</text>';
  });
  for(lv=1;lv<=5;lv++){var q=pt(0,lv);g+='<text class="rd-n" x="'+(cx+5)+'" y="'+(q[1]+3).toFixed(1)+'">'+lv+'</text>'}
  return '<svg class="radar" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kompetenzprofil von '+esc(e.name)+'">'+g+'</svg>';
}

/* ============ Entwicklung ============ */
function nineBox(){
  var h='<div class="ax y">Potenzial →</div>';
  for(var pot=3;pot>=1;pot--){for(var perf=1;perf<=3;perf++){
    var list=S.employees.filter(function(e){return e.perf===perf&&e.pot===pot});
    var hot=(perf===3&&pot>=2)||(perf===2&&pot===3),cold=(perf===1&&pot<=2)||(perf===2&&pot===1);
    h+='<div class="bx '+(hot?'hot':cold?'cold':'')+'"><h4>'+NINE_LABELS[3-pot][perf-1]+'</h4><div class="avs">'+list.map(function(e){return '<span data-act="person" data-id="'+esc(e.id)+'" title="'+esc(e.name)+'" tabindex="0" role="link">'+avatar(e.name,'sm')+'</span>'}).join('')+'</div></div>';
  }}
  h+='<div class="ax x">Leistung →</div>';
  return '<div class="nine">'+h+'</div>';
}
function viewDev(){

/* ============ Synergien ============ */
function viewSyn(){
  var team=S.employees;
  if(team.length<2)return '<section class="glass rise">'+empty('swap','Mindestens zwei Mitarbeitende nötig','Für Synergien braucht es ein Team mit bewerteten Kompetenzen.','<button class="btn primary" data-act="emp-new">'+ic('plus',16)+' Mitarbeiter anlegen</button>')+'</section>';
  var tl=tandems();

  var pairCard='<div class="s12"><div class="card-h" style="margin:0 4px 12px"><h2>Tandem-Vorschläge</h2><span class="sub">Stärke trifft Entwicklungsfeld, automatisch aus der Kompetenzmatrix</span></div>'+(pairs?'<div class="emp-grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">'+pairs+'</div>':'<section class="glass">'+empty('swap','Keine Vorschläge','Bewerte die Kompetenzen, dann erscheinen passende Paarungen.')+'</section>')+'</div>';

    var col=x.cv.kind==='gap'?'#BC123D':x.cv.kind==='single'?'#d9780a':'#1f9d55',lbl=x.cv.kind==='gap'?'Lücke':x.cv.kind==='single'?'Einzelwissen':'Gut abgedeckt';
    return '<div class="cov"><div><b>'+esc(x.c.n)+'</b><div class="muted small">'+x.c.g+(x.cv.cand.length&&x.cv.kind!=='ok'?' · Nachwuchs: '+x.cv.cand.map(function(e){return esc(e.name.split(' ')[0])}).join(', '):'')+'</div></div><div class="avrow">'+(x.cv.experts.map(function(e){return '<span title="'+esc(e.name)+' ('+rating(e,x.c.id)+')" data-act="person" data-id="'+esc(e.id)+'" role="link" tabindex="0">'+avatar(e.name,'sm')+'</span>'}).join('')||'<span class="muted small">niemand auf Niveau 4+</span>')+'</div>'+chipC(lbl,col)+'</div>';
  }).join('');
  var covCard='<section class="card glass rise s7"><div class="card-h"><h2>Kompetenz-Abdeckung</h2><span class="sub">Experten = Niveau 4 oder 5</span></div>'+covRows+'</section>';

    return '<div class="covc" style="background:rgba('+rgbOf(c)+',.16);color:'+c+'" title="Mindestbesetzung: '+m+'">'+n+' '+ic(n<m?'alert':'check',14)+'</div>';

  var legend=Object.keys(SHIFTS).map(function(k){return chipC(SHIFTS[k].l,SHIFTS[k].c)}).join('');

  'ref-status-filter':function(v){UI.refStatus=v;rerender()},
  'ref-emp-filter':function(v){UI.refEmp=v;rerender()},
  'ref-status':function(v,t){var r=byId(S.refs,t.dataset.id);if(r){r.status=v;save();rerender();toast('Status aktualisiert')}},
  'primary-pick':function(v){S.settings.primary=v;save();applyTheme()},
  'accent-pick':function(v){S.settings.accent=v;save();applyTheme()},
  'theme-select':function(v){S.settings.theme=v;save();applyTheme();rerender()},
  'comp-name':function(v,t){var c=comp(t.dataset.id);if(!c)return;v=v.trim();if(!v){t.value=c.n;return}c.n=v;c.s=v.length>13?v.split(/[\s&\/,-]+/)[0].slice(0,13):v;save()},
  'comp-group':function(v,t){var c=comp(t.dataset.id);if(c){c.g=GROUPS.indexOf(v)>-1?v:c.g;save()}},
  'comp-target':function(v,t){var c=comp(t.dataset.id);if(c){c.t=clamp(parseInt(v,10)||3,1,5);save()}}
};

/* ============ Events ============ */
document.addEventListener('click',function(e){
  var el=e.target;if(!el||!el.closest)return;
  if(UI.pop&&!el.closest('#pop')&&!el.closest('[data-pop]'))closePop();
  var t=el.closest('[data-act]');if(!t)return;
  var a=el.closest('a[href]');
  if(a&&a!==t&&t.contains(a))return;
  var fn=ACTIONS[t.dataset.act];
  if(fn)fn(t,e)
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#palQ'))closePalette();else openPalette();return}
  if(e.key==='Escape'){if($('#palQ'))closePalette();else if($('#pop'))closePop();else if($('#modal-root').firstChild){closeModal();UI.sheet=false}return}
  if($('#palQ')&&document.activeElement&&document.activeElement.id==='palQ'){
    var n=(UI.palCur||[]).length;
    if(e.key==='ArrowDown'){e.preventDefault();UI.palIdx=Math.min(n-1,UI.palIdx+1);palList()}
    else if(e.key==='ArrowUp'){e.preventDefault();UI.palIdx=Math.max(0,UI.palIdx-1);palList()}
    else if(e.key==='Enter'){e.preventDefault();palRun(UI.palIdx)}
    return;
  }
  if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('[data-act][tabindex]')&&!e.target.matches('button,a,input,select,textarea'))e.target.click();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='palQ'){UI.palQ=t.value;UI.palIdx=0;palList();return}
  var k=t.dataset&&t.dataset.input;if(k&&INPUTS[k])INPUTS[k](t.value);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='importFile'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!Array.isArray(o.employees))throw new Error('format');var n=o.v===2?normalize(o):migrateV1(o);confirmBox('Backup importieren?','Deine aktuellen Daten werden durch den Inhalt der Datei ersetzt ('+n.employees.length+' Mitarbeitende).','Importieren',function(){S=n;save();applyTheme();render();toast('Backup importiert')})}catch(err){toast('Die Datei ist kein gültiges Backup','err')}};
    rd.readAsText(t.files[0]);t.value='';return;
  }
  if(t.id==='logoFile'&&t.files&&t.files[0]){
    var f=t.files[0];t.value='';
    if(f.type.indexOf('image/')!==0){toast('Bitte eine Bilddatei wählen','err');return}
    if(f.size>400*1024){toast('Das Logo darf höchstens 400 KB groß sein','err');return}
    var r2=new FileReader();r2.onload=function(){S.settings.logo=String(r2.result);save();rerender();toast('Logo gespeichert')};r2.readAsDataURL(f);return;
  }
  var k=t.dataset&&t.dataset.change;if(k&&CHANGES[k])CHANGES[k](t.value,t);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest&&e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();var fn=FORMS[f.dataset.form];if(fn)fn(f,new FormData(f));
});
/* Hover nur für echte Maus-Zeiger: Touch und Stift lösen nie Hover-Zustände aus */
document.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse')return;
  FX.ev=e;if(FX.raf)return;
  FX.raf=(window.requestAnimationFrame||function(f){return setTimeout(f,16)})(fxFrame);
},{passive:true});
document.addEventListener('mouseleave',fxRelease);
/* Drag & Drop (Kanban: Aufgaben und Maßnahmen) */
document.addEventListener('dragstart',function(e){
  var c=e.target.closest&&e.target.closest('.task[data-kind]');if(!c)return;
  UI.drag={kind:c.dataset.kind,id:c.dataset.id};c.classList.add('dragging');
  if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id)}catch(err){}}
});
document.addEventListener('dragend',function(){$$('.task.dragging').forEach(function(x){x.classList.remove('dragging')});$$('.col.over').forEach(function(x){x.classList.remove('over')});UI.drag=null});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('.col[data-kind]');if(!c||!UI.drag||c.dataset.kind!==UI.drag.kind)return;e.preventDefault();c.classList.add('over')});
document.addEventListener('dragleave',function(e){var c=e.target.closest&&e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',function(e){
  var c=e.target.closest&&e.target.closest('.col[data-kind]');if(!c||!UI.drag||c.dataset.kind!==UI.drag.kind)return;e.preventDefault();
  var d=UI.drag;UI.drag=null;
  var list=d.kind==='meas'?S.meas:S.tasks,t=byId(list,d.id);
  if(t&&t.status!==c.dataset.col){t.status=c.dataset.col;save();rerender();toast('Verschoben nach „'+(d.kind==='meas'?MEAS_STATUS:COLS).filter(function(x){return x.id===c.dataset.col})[0].l+'“')}
});
window.addEventListener('hashchange',function(){render()});
window.addEventListener('resize',moveInd);
window.addEventListener('scroll',function(){closePop();fxRelease()},{passive:true,capture:true});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.settings.theme==='auto'){applyTheme();rerender()}})}catch(e){}}

/* ============ Start ============ */
S=load();
if(!S){seed();save()}
applyTheme();
renderNav();
render();
})();

</script>
</body>
</html>
